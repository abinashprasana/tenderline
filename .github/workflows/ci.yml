name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenderline
          POSTGRES_PASSWORD: tenderline
          POSTGRES_DB: tenderline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderline" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Tests (real Postgres, no live TED, no real LLM)
        run: uv run pytest -q
      - name: Migrations have no drift
        env:
          DATABASE_URL: postgresql+psycopg://tenderline:tenderline@localhost:5432/tenderline
        run: uv run alembic upgrade head && uv run alembic check
      - name: OpenAPI spec matches the code
        run: uv run tenderline openapi && git diff --exit-code -- docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match docs/openapi.json
        run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV: dev
      OTEL_ENABLED: "false"
      INGEST_CRON: "0 0 1 1 *" # no scheduled TED ingestion during the run; notices come from the seed tool
    steps:
      - uses: actions/checkout@v4
      - name: Start db, API and web app
        run: docker compose up -d --build --wait db app web
      - name: Seed synthetic notices (no live TED calls)
        run: |
          for i in $(seq 1 60); do curl -fs localhost:8000/readyz && break; sleep 2; done
          docker compose exec -T app tenderline seed --orgs 1 --notices 300 --proposals 0 --out /tmp/seed.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright (flows, axe in both themes, performance budget)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: failure()
        run: docker compose logs app web --tail 200

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform fmt -check

  image:
    needs: [test, frontend, e2e, terraform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  check-deploy-secrets:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ] && [ -n "$USER_" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Deploy secrets not set: skipping deploy."; fi

  deploy:
    needs: check-deploy-secrets
    if: needs.check-deploy-secrets.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new $SSH_USER@$HOST"
          scp -i key -o StrictHostKeyChecking=accept-new -r docker-compose.prod.yml deploy docker scripts "$SSH_USER@$HOST:/opt/tenderline/"
          $SSH "cd /opt/tenderline && echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin \
            && export TENDERLINE_IMAGE=${IMAGE,,}:sha-${GITHUB_SHA::7} TENDERLINE_WEB_IMAGE=${IMAGE,,}-web:sha-${GITHUB_SHA::7} \
            && docker compose -f docker-compose.prod.yml --env-file .env pull app caddy \
            && APP_VERSION=${GITHUB_SHA::7} docker compose -f docker-compose.prod.yml --env-file .env up -d"
          rm -f key
