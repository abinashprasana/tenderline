name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenderline
          POSTGRES_PASSWORD: tenderline
          POSTGRES_DB: tenderline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderline" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Tests (real Postgres, no live TED, no real LLM)
        run: uv run pytest -q
      - name: Migrations have no drift
        env:
          DATABASE_URL: postgresql+psycopg://tenderline:tenderline@localhost:5432/tenderline
        run: uv run alembic upgrade head && uv run alembic check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform fmt -check

  image:
    needs: [test, terraform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-deploy-secrets:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ] && [ -n "$USER_" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Deploy secrets not set: skipping deploy."; fi

  deploy:
    needs: check-deploy-secrets
    if: needs.check-deploy-secrets.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new $SSH_USER@$HOST"
          scp -i key -o StrictHostKeyChecking=accept-new -r docker-compose.prod.yml deploy docker scripts "$SSH_USER@$HOST:/opt/tenderline/"
          $SSH "cd /opt/tenderline && echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin \
            && TENDERLINE_IMAGE=${IMAGE,,}:sha-${GITHUB_SHA::7} docker compose -f docker-compose.prod.yml --env-file .env pull app \
            && TENDERLINE_IMAGE=${IMAGE,,}:sha-${GITHUB_SHA::7} docker compose -f docker-compose.prod.yml --env-file .env up -d"
          rm -f key
